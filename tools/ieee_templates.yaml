# string.Template layouts used by tools/make_ieee_tex.py (see
# doc/make_tex_flow.md). Each entry is filled with
#     setTmplt = lambda tmpl, dct : Template(tmpl).substitute(dct)
# from a dictionary the generator builds for one item. A literal "$" in a
# template must be written "$$"; maths belongs in the content YAML, where it
# needs no escaping.

# The IEEEtran preamble, copied from
# /home/Dropbox/doc/Papers/IEEE/TransformedVariables/ComplexFilters_TrnsfrmdVariables.tex
# with \usepackage{cite} added (sorted, compressed citations, as the
# IEEEtran HOWTO recommends), \usepackage{url} (line breaks in \url{}) and
# \graphicspath for the figures folder.
preamble: |
  \usepackage{cite}
  \usepackage{amsmath,amssymb,amsfonts}
  \usepackage{algorithmic}
  \usepackage{graphicx}
  \usepackage{textcomp}
  \usepackage{xcolor}
  \usepackage{listings}
  \usepackage{url}
  \usepackage{enumitem}
  \setlist{noitemsep, topsep=2pt}

  % tighten space between floats and around them (IEEEtran defaults:
  % \textfloatsep 1.55\baselineskip, \floatsep 0.85\baselineskip, both with
  % generous stretch)
  \setlength{\textfloatsep}{0.8\baselineskip plus 0.3\baselineskip minus 0.2\baselineskip}
  \setlength{\dbltextfloatsep}{0.8\baselineskip plus 0.3\baselineskip minus 0.2\baselineskip}
  \setlength{\floatsep}{0.7\baselineskip plus 0.2\baselineskip minus 0.15\baselineskip}
  \setlength{\dblfloatsep}{0.7\baselineskip plus 0.2\baselineskip minus 0.15\baselineskip}

  % tighten section/subsection heading glue, above and below
  % (IEEEtran conference default: 1.5ex with 1.5ex stretch above, 0.7ex
  % below; on a page that runs short, \flushbottom stretches that glue into
  % large visible gaps). Keep a small stretch so pages can still fill.
  \makeatletter
  \def\section{\@startsection{section}{1}{\z@}{0.9ex plus 0.3ex minus 0.2ex}%
    {0.5ex plus 0.1ex}{\normalfont\normalsize\centering\scshape}}%
  \def\subsection{\@startsection{subsection}{2}{\z@}{0.9ex plus 0.3ex minus 0.2ex}%
    {0.5ex plus 0.1ex}{\normalfont\normalsize\itshape}}%
  \makeatother

  % tighten displayed-equation glue (IEEEtran default: 1.5ex + 3pt above
  % and below); set at \begin{document} so font-size commands can't reset it
  \AtBeginDocument{%
    \setlength{\abovedisplayskip}{0.5\baselineskip plus 0.1\baselineskip minus 0.1\baselineskip}%
    \setlength{\belowdisplayskip}{0.5\baselineskip plus 0.1\baselineskip minus 0.1\baselineskip}%
    \setlength{\abovedisplayshortskip}{0.25\baselineskip plus 0.05\baselineskip}%
    \setlength{\belowdisplayshortskip}{0.25\baselineskip plus 0.05\baselineskip}%
  }

  \lstset{language=Matlab}
  \lstset{tabsize=2}
  \lstset{flexiblecolumns=true}

  \def\BibTeX{{\rm B\kern-.05em{\sc i\kern-.025em b}\kern-.08em
      T\kern-.1667em\lower.7ex\hbox{E}\kern-.125emX}}

  \graphicspath{{${figures_dir}}}

document: |
  \documentclass[${class_options}]{IEEEtran}
  ${preamble}
  ${extra_preamble}
  \begin{document}

  \title{${title}}

  \author{${authors}}

  \maketitle

  \begin{abstract}
  ${abstract}
  \end{abstract}

  \begin{IEEEkeywords}
  ${keywords}
  \end{IEEEkeywords}

  ${body}

  ${bibliography}

  \end{document}

# one author; blocks are joined with "\and" (side-by-side columns)
author_block: |-
  \IEEEauthorblockN{${name}}
  \IEEEauthorblockA{${affiliation}}

label: '\label{${label}}'

section: |-
  \${cmd}{${title}}${label}

  ${body}

text: '${value}'

# one numbered equation; several lines (align: true) share its number
equation: |-
  \begin{equation}${label}
  ${body}
  \end{equation}

equation_lines: |-
  \begin{aligned}
  ${lines}
  \end{aligned}

figure: |-
  \begin{figure${star}}[${position}]
  \centering
  \includegraphics[width=${width}${widthref}]{${file}}
  \caption{${caption}}${label}
  \end{figure${star}}

# IEEE puts table captions above the table
table: |-
  \begin{table${star}}[${position}]
  \renewcommand{\arraystretch}{1.0}
  \caption{${caption}}${label}
  \centering
  \begin{tabular}{${columns}}
  \hline
  ${header} \\
  \hline
  ${rows}
  \hline
  \end{tabular}
  \end{table${star}}

table_row: '${cells} \\'

list: |-
  \begin{${env}}
  ${items}
  \end{${env}}

# IEEEtran description lists need the label width set to the widest label
dscrpt_list: |-
  \begin{description}[\IEEEsetlabelwidth{${widest}}]
  ${items}
  \end{description}

list_item: '\item ${value}'

dscrpt_item: '\item[${title}] ${text}'

raw: '${value}'

bibliography: |-
  \begin{thebibliography}{${widest}}
  ${items}
  \end{thebibliography}

bibitem: '\bibitem{${key}} ${text}'
